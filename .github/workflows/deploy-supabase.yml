name: Deploy Mosaic database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "deploy-mosaic" to apply pending migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mosaic-production-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy-mosaic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link the explicitly configured Mosaic project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Review pending migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Lint hosted schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase db lint --linked --level error --fail-on error
      - name: Install Chromium for production verification
        run: npx playwright install --with-deps chromium
      - name: Verify authenticated production logging and cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          E2E_BASE_URL: https://mosaic-eight-theta.vercel.app
          E2E_PRODUCTION_URL: https://mosaic-eight-theta.vercel.app
        run: |
          set -euo pipefail
          service_key="$(npx supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --reveal --output json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk).on("end", () => { const keys = JSON.parse(data); const key = keys.find((entry) => entry.name === "service_role" || entry.role === "service_role" || entry.name === "secret"); if (!key?.api_key) process.exit(1); process.stdout.write(key.api_key); })')"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" npx playwright test e2e/production-phase37.spec.ts
